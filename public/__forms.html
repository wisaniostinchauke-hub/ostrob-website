<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form detection</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Netlify scans static HTML at build time to register forms. Next.js
      app-router pages don't reliably produce that, so this file declares the
      fields instead. The live form in components/ContactForm.tsx POSTs here.
      Do not delete — form submissions stop working without it.
    -->
    <form name="project-intake" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-intake" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="project" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
